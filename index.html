<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/><line x1='16' y1='13' x2='8' y2='13'/><line x1='16' y1='17' x2='8' y2='17'/><polyline points='10 9 9 9 8 9'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>betterpo | Congressional Debate PO & Live Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Playfair+Display:wght@600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      document.documentElement.classList.remove('dark');
    </script>
  </head>
  <body class="bg-[#FCFBF7] text-[#0A1128] min-h-screen">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Fallback: If root is not mounted within 400ms (e.g. running statically without Vite), load the pre-compiled bundle
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          console.warn('[BetterPO] Development server inactive or failed to mount, loading bundled production build...');
          if (!document.querySelector('link[href*="index.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './assets/index.css';
            document.head.appendChild(link);
          }
          const script = document.createElement('script');
          script.type = 'module';
          script.src = './assets/app.js';
          document.body.appendChild(script);
        }
      }, 400);
    </script>
  </body>
</html>
